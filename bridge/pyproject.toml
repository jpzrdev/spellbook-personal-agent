[project]
name = "bridge"
version = "0.1.0"
description = "Bridge: Gandalf's backend (router + vault)"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "av>=18,<19",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "python-dotenv>=1.2.4",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.32",
    "python-ulid>=4.0.1",
    "pywebpush>=2.5.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
